name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests (vitest + node suites)
        run: npm run test:ci

      # Report-only: the committed tree carries pre-existing type errors
      # (53 in count); making it blocking would bury CI signal behind old code.
      - name: Type check (report-only)
        run: npm run check:ts
        continue-on-error: true

      # Deliberately blocking, per project policy. The Vercel adapter chain
      # currently ships high advisories (path-to-regexp, zod). When a safe
      # upgrade lands this step starts passing on its own.
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

      # E2E (Playwright) is intentionally omitted: there is no playwright.config
      # and no spec files yet. Re-add this step when the first spec lands.

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Personal accounts do not need GITLEAKS_LICENSE.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependabot-auto-approve:
    runs-on: ubuntu-latest
    if: github.repository == 'ezequielranieri/new-portfolio'
    steps:
      - uses: actions/checkout@v7
      - name: Auto-approve Dependabot PRs
        run: |
          gh pr list --search 'is:open label:"dependencies"' |
          gh pr merge --auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}